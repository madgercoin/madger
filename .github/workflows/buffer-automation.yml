name: MADGER Buffer Automation

on:
  push:
    branches:
      - main
    paths:
      - "content/buffer-schedule.json"
  workflow_dispatch:
    inputs:
      operation:
        description: Buffer operation
        required: true
        type: choice
        default: discover
        options:
          - discover
          - publish
          - publish-now
          - cancel
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: madger-buffer-automation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate automation files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate JavaScript, scheduling behavior, and schedule JSON
        run: |
          node --check scripts/buffer-automation.mjs
          node --check scripts/buffer-automation-core.mjs
          node --test test/buffer-automation.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('content/buffer-schedule.json','utf8'))"

  buffer:
    name: Run Buffer operation
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Confirm secret is configured
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: test -n "$BUFFER_API_TOKEN"
      - name: Discover connected Buffer channels
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'discover'
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
        run: node scripts/buffer-automation.mjs discover
      - name: Schedule enabled posts
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish')
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
        run: node scripts/buffer-automation.mjs publish content/buffer-schedule.json
      - name: Publish flagged posts now
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-now'
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
        run: node scripts/buffer-automation.mjs publish-now content/buffer-schedule.json
      - name: Cancel flagged posts
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'cancel'
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: node scripts/buffer-automation.mjs cancel content/buffer-schedule.json
