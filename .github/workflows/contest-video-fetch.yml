name: Contest Video Fetch Bridge

on:
  push:
    branches: [main]
    paths:
      - 'contest-sync/request.json'

permissions:
  contents: read
  id-token: write

env:
  BRIDGE_URL: https://wtqcolceuvlxrelugvjw.supabase.co/functions/v1/contest-video-bridge
  OIDC_AUDIENCE: madger-contest-video-bridge

jobs:
  fetch-video:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read request
        id: req
        shell: bash
        run: |
          action=$(jq -r '.action // "video"' contest-sync/request.json)
          echo "action=$action" >> "$GITHUB_OUTPUT"
          if [[ "$action" == "idle" ]]; then
            exit 0
          fi
          if [[ "$action" != "video" ]]; then
            echo 'Invalid action' >&2
            exit 1
          fi
          submission_id=$(jq -r '.submission_id' contest-sync/request.json)
          file_name=$(jq -r '.file_name' contest-sync/request.json)
          expected_size=$(jq -r '.file_size // 0' contest-sync/request.json)
          if [[ -z "$submission_id" || "$submission_id" == "null" || -z "$file_name" || "$file_name" == "null" ]]; then
            echo 'Invalid request.json' >&2
            exit 1
          fi
          echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"
          echo "file_name=$file_name" >> "$GITHUB_OUTPUT"
          echo "expected_size=$expected_size" >> "$GITHUB_OUTPUT"

      - name: Get GitHub OIDC token
        if: steps.req.outputs.action == 'video'
        id: oidc
        shell: bash
        run: |
          token_json=$(curl -fsSL --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")
          token=$(printf '%s' "$token_json" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Fetch secure video
        if: steps.req.outputs.action == 'video'
        id: fetch
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SUBMISSION_ID: ${{ steps.req.outputs.submission_id }}
          FILE_NAME: ${{ steps.req.outputs.file_name }}
          EXPECTED_SIZE: ${{ steps.req.outputs.expected_size }}
        run: |
          mkdir -p contest-sync/out
          encoded_name=$(jq -rn --arg v "$FILE_NAME" '$v|@uri')
          curl --fail --location --silent --show-error \
            --max-time 60 --retry 2 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$BRIDGE_URL?submission_id=$SUBMISSION_ID&file_name=$encoded_name" \
            --output "contest-sync/out/$FILE_NAME"
          test -s "contest-sync/out/$FILE_NAME"
          actual_size=$(wc -c < "contest-sync/out/$FILE_NAME" | tr -d ' ')
          if [[ "$EXPECTED_SIZE" =~ ^[0-9]+$ ]] && [[ "$EXPECTED_SIZE" -gt 0 ]] && [[ "$actual_size" != "$EXPECTED_SIZE" ]]; then
            echo "File size mismatch: expected $EXPECTED_SIZE, got $actual_size" >&2
            exit 1
          fi
          sha256sum "contest-sync/out/$FILE_NAME" | tee contest-sync/out/SHA256.txt
          printf '%s\n' "$actual_size" > contest-sync/out/SIZE.txt
          echo "artifact_name=contest-video-$SUBMISSION_ID" >> "$GITHUB_OUTPUT"

      - name: Upload transfer artifact
        if: steps.req.outputs.action == 'video'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fetch.outputs.artifact_name }}
          path: contest-sync/out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
