name: Compare existing Android APK controls once
on:
  workflow_dispatch:
  push:
    branches: [fix/android-cold-restore-diagnostic-20261105]
    paths: [.github/workflows/android-same-apk-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  existing-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: baseline-build34
            run_id: 41929411077
            artifact_id: '13371759264'
            apk_sha256: baf21369186baed77315b906e632509428105500d4487818482a7d95f2d90a3a
            # PR head 4c0a603; APK embeds its tested merge revision.
            source_revision: 1a6c513bdd6ab3f481ec702df5490ce22c22adc0
          - label: current-ed1df5f
            run_id: 41978331482
            artifact_id: '13392929798'
            apk_sha256: 0e34196f62f63af9567f08290646f61c138e25b942f6e46484f71b6be5bbc6a7
            source_revision: 2359b634228871b522b8aa4064651693b8b0b125
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics-source
      - uses: actions/checkout@v4
        with:
          ref: ed1df5fc530f263f9d34a26c56773762aa50a2be
          path: app-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;36.0.0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ matrix.artifact_id }}
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          path: app-source/mobile
          merge-multiple: true
      - name: Verify exact previously built APK
        working-directory: app-source/mobile
        run: |
          echo '${{ matrix.apk_sha256 }}  android/app/build/outputs/apk/release/app-release.apk' | sha256sum -c -
      - name: Stage only candidate capture harness and test it
        run: |
          cp diagnostics-source/mobile/scripts/android-expedition-smoke.py app-source/mobile/scripts/android-expedition-smoke.py
          cp diagnostics-source/mobile/scripts/test_android_raw_capture.py app-source/mobile/scripts/test_android_raw_capture.py
          python3 -m venv /tmp/madger-android-qa
          /tmp/madger-android-qa/bin/pip install 'uiautomator2==3.7.0' pillow
          /tmp/madger-android-qa/bin/python -m unittest discover -s app-source/mobile/scripts -p test_android_raw_capture.py -v
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare bounded emulator exit supervisor
        shell: bash
        run: |
          cat > /tmp/madger-emulator-supervisor.py <<'PY_SUPERVISOR'
          #!/usr/bin/env python3
          """Preserve official emulator argv; record OS exit without retaining raw output."""
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import threading
          import time


          def supervise(command, out, limit=1650):
              out.mkdir(parents=True, exist_ok=True)
              report = {'status': 'starting', 'started_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                        'output_categories': {}, 'supervisor_timeout': False}
              report_path = out / 'supervisor.json'
              lock = threading.Lock()
              def save():
                  temporary = out / 'supervisor.tmp'
                  temporary.write_text(json.dumps(report, indent=2) + '\n')
                  temporary.replace(report_path)
              save()
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                         text=True, errors='replace', start_new_session=True)
              report.update(status='running', child_pid=process.pid)
              save()
              def drain():
                  # Categorize only; never persist lines, auth material, argv, or env.
                  patterns = {'segmentation': 'segmentation fault', 'fatal': 'fatal',
                              'abort': 'aborted', 'vulkan': 'vulkan', 'out_of_memory': 'out of memory',
                              'color_buffer': 'colorbuffer', 'boot_complete': 'boot completed'}
                  for line in process.stdout:
                      lowered = line.lower()
                      with lock:
                          for category, token in patterns.items():
                              if token in lowered:
                                  report['output_categories'][category] = report['output_categories'].get(category, 0) + 1
              reader = threading.Thread(target=drain, daemon=True)
              reader.start()
              def interrupted(signum, frame):
                  report['supervisor_received_signal'] = signum
                  if process.poll() is None:
                      os.killpg(process.pid, signal.SIGTERM)
              for signum in (signal.SIGTERM, signal.SIGINT):
                  signal.signal(signum, interrupted)
              try:
                  code = process.wait(timeout=limit)
              except subprocess.TimeoutExpired:
                  report['supervisor_timeout'] = True
                  os.killpg(process.pid, signal.SIGTERM)
                  try:
                      code = process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      code = process.wait(timeout=5)
              reader.join(timeout=2)
              with lock:
                  report.update(status='exited', return_code=code,
                                terminating_signal=-code if code < 0 else None,
                                test_teardown_marked=(out / 'test-teardown-requested').exists(),
                                ended_utc=time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()))
                  save()
              return code if code >= 0 else 128 - code


          def is_avd_launch(arguments):
              return '-avd' in arguments or any(value.startswith('@') for value in arguments)


          if __name__ == '__main__':
              binary = str(Path(__file__).resolve().with_name('emulator.supervised-original'))
              if not is_avd_launch(sys.argv[1:]):
                  # Utility/version/cleanup invocations must never overwrite the AVD report.
                  os.execv(binary, [binary, *sys.argv[1:]])
              out = Path(os.environ['GITHUB_WORKSPACE']) / 'app-source/mobile/android-smoke/emulator-supervisor'
              raise SystemExit(supervise([binary, *sys.argv[1:]], out))
          PY_SUPERVISOR
      - name: Run unchanged suites once with live host observations
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 16740729
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          working-directory: app-source/mobile
          pre-emulator-launch-script: |
            test ! -e "$ANDROID_HOME/emulator/emulator.supervised-original" && mv "$ANDROID_HOME/emulator/emulator" "$ANDROID_HOME/emulator/emulator.supervised-original" && cp /tmp/madger-emulator-supervisor.py "$ANDROID_HOME/emulator/emulator" && chmod +x "$ANDROID_HOME/emulator/emulator"
          script: |
            adb shell wm size 480x960
            adb shell wm density 160
            status=0; MADGER_ANDROID_RAW_CAPTURE=1 MADGER_ANDROID_APK="$PWD/android/app/build/outputs/apk/release/app-release.apk" MADGER_ANDROID_PACKAGE=com.madgercoin.preview MADGER_ANDROID_EVIDENCE_DIR="$PWD/android-smoke" MADGER_ANDROID_RESET=1 /tmp/madger-android-qa/bin/python ../../diagnostics-source/mobile/scripts/android-host-diagnostic.py || status=$?; mkdir -p android-smoke/emulator-supervisor; touch android-smoke/emulator-supervisor/test-teardown-requested; exit "$status"
      - name: Wait briefly for supervised exit record
        if: always()
        shell: bash
        run: |
          python3 - <<'PY_EXIT'
          import json, time
          from pathlib import Path
          path = Path('app-source/mobile/android-smoke/emulator-supervisor/supervisor.json')
          for _ in range(50):
              if path.exists() and json.loads(path.read_text()).get('status') == 'exited':
                  break
              time.sleep(.2)
          else:
              print('Emulator exit record unavailable or still running; do not infer an exit signal.')
          PY_EXIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madger-same-apk-diagnostic-${{ matrix.label }}
          path: app-source/mobile/android-smoke
          retention-days: 14
