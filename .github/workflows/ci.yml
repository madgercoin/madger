name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git diff --check
      - run: npm run build
      - run: npm run check
      - run: npm run validate:js
      - run: npm run test:buffer
      - run: npm run test:performance
      - run: npm run validate:site
      - run: npm run validate:dist
      - run: npm run scan:secrets
      - run: npm audit --omit=dev
