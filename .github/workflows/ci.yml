name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check patch formatting
        run: git diff --check
      - name: Build and validate Cloudflare package
        run: npm run check
      - name: Run repository validation
        run: npm run validate
      - name: Audit the complete dependency tree
        run: npm audit
