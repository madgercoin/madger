name: Generate Cloudflare claim link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-claim.yml"
      - "wrangler.temporary.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare temporary asset bundle
        run: rm -f dist/assets/Madger_Official_Outro_Clip.mp4
      - name: Create temporary Cloudflare deployment
        shell: bash
        run: |
          set +e
          npx wrangler deploy --temporary --config wrangler.temporary.json > "$RUNNER_TEMP/cloudflare-claim.txt" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
        id: deploy
      - name: Store private claim details
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-claim
          path: ${{ runner.temp }}/cloudflare-claim.txt
          retention-days: 1
          if-no-files-found: error
      - name: Confirm deployment creation
        if: steps.deploy.outputs.status != '0'
        run: exit 1
