name: Refresh Expo compatibility lock

on:
  push:
    branches:
      - codex/play-store-readiness
    paths:
      - .github/workflows/refresh-expo-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/play-store-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Refresh compatible Expo packages
        working-directory: mobile
        run: npm install @expo/ui@~57.0.25 expo@~57.0.30 expo-router@~57.0.28
      - name: Commit refreshed manifest and lockfile
        run: |
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git commit -m "Update Expo SDK 57 compatibility patches"
          git push origin HEAD:codex/play-store-readiness
