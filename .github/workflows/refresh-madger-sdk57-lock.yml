name: MADGER Release Candidate Source Gate (temporary)

on:
  push:
    branches: [fix/madger-android-release-gates-20261107]
    paths:
      - .github/workflows/refresh-madger-sdk57-lock.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Fresh install with exact-source security patches
        run: npm ci --no-audit --no-fund
      - name: Test app, audio, companions, native fixture and SDK 57 compatibility
        run: npm run release:check
      - name: Expo Doctor and production bundle profile regression
        run: |
          npx expo-doctor
          node --test scripts/test-production-build-only.cjs
