name: MADGER SDK 57 release-gate refresh (temporary)

on:
  push:
    branches: [fix/madger-android-release-gates-20261107]
    paths:
      - .github/workflows/refresh-madger-sdk57-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'madgercoin/madger'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Refresh only the seven Expo SDK 57 patch-level dependencies
        working-directory: mobile
        run: |
          npm install --save-exact --ignore-scripts --no-audit --no-fund \
            expo@57.0.32 \
            expo-asset@57.0.21 \
            expo-constants@57.0.23 \
            expo-gl@57.0.3 \
            expo-glass-effect@57.0.5 \
            expo-router@57.0.30 \
            expo-splash-screen@57.0.11
      - name: Commit the deterministic package and lockfile delta
        run: |
          git add mobile/package.json mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Align Expo SDK 57 patch dependencies and lockfile"
            git push origin HEAD:fix/madger-android-release-gates-20261107
          fi
      - name: Verify fresh install and release gates on generated lockfile
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const {createRequire}=require('node:module'); const p=createRequire(require.resolve('expo/package.json'))('@expo/cli/package.json');console.log('CLI_VERSION',p.version)"
          node -e "const {createRequire}=require('node:module');const r=createRequire(require.resolve('expo/package.json'));console.log('CLI_ROOT',r.resolve('@expo/cli/package.json'));"
          CLI_ROOT="$(dirname "$(node -e "const {createRequire}=require('node:module');console.log(createRequire(require.resolve('expo/package.json')).resolve('@expo/cli/package.json'))")")"
          echo "DEVTOOLS_SOURCE_FILES"
          find "$CLI_ROOT/build/src" -type f | grep -Ei 'DevTools|[Pp]lugin|MCP' | head -70 || true
          echo "SEARCH_VALIDATION_CALLS"
          grep -R -l -E 'PluginSchema|DevToolsPluginOutputSchema|createMCPDevToolsExtensionSchema' "$CLI_ROOT/build/src" | head -40 || true
          echo "EXPO_57_REVIEW_REQUIRED"
          exit 1
