name: MADGER SDK 57 release-gate refresh (temporary)

on:
  push:
    branches: [fix/madger-android-release-gates-20261107]
    paths:
      - .github/workflows/refresh-madger-sdk57-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'madgercoin/madger'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Refresh only the seven Expo SDK 57 patch-level dependencies
        working-directory: mobile
        run: |
          npm install --save-exact --ignore-scripts --no-audit --no-fund \
            expo@57.0.32 \
            expo-asset@57.0.21 \
            expo-constants@57.0.23 \
            expo-gl@57.0.3 \
            expo-glass-effect@57.0.5 \
            expo-router@57.0.30 \
            expo-splash-screen@57.0.11
      - name: Commit the deterministic package and lockfile delta
        run: |
          git add mobile/package.json mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Align Expo SDK 57 patch dependencies and lockfile"
            git push origin HEAD:fix/madger-android-release-gates-20261107
          fi
      - name: Preserve pristine audited CLI 57.0.33 source for hash-locked review
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          CLI_ROOT="$(dirname "$(node -e "const {createRequire}=require('node:module');console.log(createRequire(require.resolve('expo/package.json')).resolve('@expo/cli/package.json'))")")"
          mkdir -p scripts/devtools-validation-57_0_33-original
          for name in DevToolsPlugin.schema.js DevToolsPluginCliExtensionResults.js; do
            cp "$CLI_ROOT/build/src/start/server/devtools/$name" "scripts/devtools-validation-57_0_33-original/$name.txt"
            sha256sum "scripts/devtools-validation-57_0_33-original/$name.txt"
          done
          git add scripts/devtools-validation-57_0_33-original
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Vendor exact upstream Expo CLI 57.0.33 validation fixtures for audit"
            git push origin HEAD:fix/madger-android-release-gates-20261107
          fi
          echo "No gameplay or release credential changes"
