name: Expedition preview APK QA

on:
  pull_request:
    paths:
      - mobile/expedition-preview-build.json
      - mobile/scripts/android-expedition-smoke.py
      - mobile/scripts/android-preview-smoke.py
      - mobile/scripts/android-preview-suite.py
      - mobile/scripts/verify-expedition-apk.py
      - .github/workflows/expedition-preview-qa.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-apk-smoke:
    name: Verify and exercise the selected preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MADGER_ANDROID_APK: ${{ github.workspace }}/.qa-artifacts/madger-expedition-preview.apk
      MADGER_ANDROID_EVIDENCE_DIR: ${{ github.workspace }}/mobile/expedition-evidence/android-preview
      MADGER_ANDROID_RESET: '1'
      MADGER_SOURCE_ARTIFACT_DIR: ${{ github.workspace }}/.qa-artifacts/source
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check isolated native harness guard
        run: |
          python3 mobile/scripts/test-android-quickstep-dialog.py -v
          python3 mobile/scripts/test-apk-source-manifest.py -v

      - name: Validate the selected build source
        id: selected
        run: python3 mobile/scripts/verify-expedition-apk.py --workflow-outputs

      - name: Download the exact GitHub build artifact
        if: steps.selected.outputs.github_run_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.selected.outputs.github_artifact_id }}
          run-id: ${{ steps.selected.outputs.github_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.MADGER_SOURCE_ARTIFACT_DIR }}
          merge-multiple: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android inspection tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'

      - name: Download and verify the manifest's exact APK
        run: python3 mobile/scripts/verify-expedition-apk.py

      - name: Set up native UI test dependencies
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/expedition-qa-venv"
          "$RUNNER_TEMP/expedition-qa-venv/bin/python" -m pip install --disable-pip-version-check 'uiautomator2==3.7.0' pillow

      - name: Enable KVM for the emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Expedition and Burrow Run native smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # 37.2.13 fixes GLES host resources retained after guest process exit.
          # Relevant to repeated lifecycle QA; prior offline failures are not proven OOM.
          # https://developer.android.com/studio/releases/emulator
          emulator-build: 16740729
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Match Mobile CI: Vulkan-disabled runs repeatedly lost the emulator
          # during PBR loading. Keep real GLES and all strict runtime assertions.
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          # Keep software-GPU fill rate representative of a low-density phone.
          # Pixel 6's full 1080x2400 buffer can stall SwiftShader, invoking the
          # app's intentional long-frame safety pause before controls are tested.
          script: |
            adb shell wm size 480x960
            adb shell wm density 160
            "$RUNNER_TEMP/expedition-qa-venv/bin/python" mobile/scripts/android-preview-suite.py

      - name: Preserve host emulator diagnostics without process secrets
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          out="mobile/expedition-evidence/android-preview/host-diagnostics"
          mkdir -p "$out"
          date -u +%FT%TZ > "$out/collected-at.txt"
          free -m > "$out/memory-summary.txt" || true
          cat /proc/meminfo > "$out/meminfo.txt" || true
          # Process names and memory only: never arguments or environment values.
          ps -eo pid,comm,rss,vsz --sort=-rss > "$out/process-memory.txt" || true
          for metric in memory.events memory.events.local memory.current memory.max memory.peak; do
            if [ -r "/sys/fs/cgroup/$metric" ]; then
              cat "/sys/fs/cgroup/$metric" > "$out/cgroup-$metric.txt"
            fi
          done
          (sudo -n dmesg --ctime 2>/dev/null || true) | grep -Ei 'out of memory|oom-kill|killed process|segfault|qemu|emulator' > "$out/kernel-emulator-events.txt" || true
          # Crashpad dumps may contain process memory. Preserve existence, sizes,
          # timestamps and hashes, not raw dumps/attachments that could hold secrets.
          for database in /tmp/android-runner/emu-crash-* /tmp/emu-crash-*; do
            [ -e "$database" ] || continue
            find "$database" -maxdepth 3 -type f -printf '%p %s bytes %TY-%Tm-%TdT%TH:%TM:%TS\n' >> "$out/crash-database-inventory.txt" 2>/dev/null || true
            find "$database" -maxdepth 3 -type f -exec sha256sum {} \; >> "$out/crash-database-sha256.txt" 2>/dev/null || true
          done
          printf '%s\n' 'No raw crash dumps, process arguments, or environment values collected. Missing kernel events do not exclude host OOM.' > "$out/interpretation.txt"

      - name: Upload APK verification and native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expedition-preview-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile/expedition-evidence/android-preview/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the verified Android installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: madger-expedition-preview-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MADGER_ANDROID_APK }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
