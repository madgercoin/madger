name: MADGER Social Performance

on:
  # Buffer exposes a bounded daily API budget. Keep external metric reads to
  # the daily refresh or an explicit manual dispatch; ordinary repository and
  # campaign-manifest pushes are validated by CI without consuming Buffer calls.
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: write

concurrency:
  group: madger-social-performance
  cancel-in-progress: false

jobs:
  report:
    name: Refresh Buffer performance report
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Validate monitor and report calculations
        run: |
          node --check scripts/buffer-performance.mjs
          node --check scripts/buffer-performance-core.mjs
          node --test test/buffer-performance.test.mjs
      - name: Confirm Buffer secret
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: test -n "$BUFFER_API_TOKEN"
      - name: Generate report
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
        run: node scripts/buffer-performance.mjs
      - name: Commit changed report
        run: |
          if [ -z "$(git status --porcelain -- reports/social/latest.md reports/social/latest.json)" ]; then
            echo "No report changes."
            exit 0
          fi
          git config user.name "madger-automation"
          git config user.email "actions@users.noreply.github.com"
          git add reports/social/latest.md reports/social/latest.json
          git commit -m "Refresh social performance report"
          git pull --rebase origin main
          git push
      - name: Enforce campaign channel health
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const report = JSON.parse(fs.readFileSync("reports/social/latest.json", "utf8")); const atRisk = report.campaign?.summary?.atRiskPosts ?? []; if (atRisk.length) { console.error(`Scheduled posts depend on an unhealthy Buffer channel: ${atRisk.join(", ")}`); process.exit(1); }'
