name: Deploy production website

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "*.webmanifest"
      - "*.xml"
      - "*.png"
      - "*.jpg"
      - "*.webp"
      - "*.svg"
      - "*.gif"
      - "*.mp4"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "site-config.mjs"
      - "wrangler.json"
      - "_headers"
      - "_redirects"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - run: npm run check
      - name: Confirm Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare API token secret" >&2; exit 1; }
      - name: Ensure private contest R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
        run: |
          set +e
          output="$(npx wrangler r2 bucket create madger-video-contest-originals 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && ! printf '%s' "$output" | grep -qi 'already exists'; then
            printf '%s\n' "$output" >&2
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      - name: Verify canonical production deployment
        run: |
          for attempt in 1 2 3 4 5; do
            npm run check:deployment && exit 0
            echo "Production verification attempt ${attempt} failed; waiting for edge propagation..." >&2
            sleep 10
          done
          exit 1
