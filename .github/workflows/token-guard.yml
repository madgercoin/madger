name: MADGER Token Guard

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/token-guard.yml"
      - "scripts/verify-token.mjs"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: madger-token-guard
  cancel-in-progress: false

jobs:
  verify:
    name: Verify immutable token facts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate verifier
        run: node --check scripts/verify-token.mjs
      - name: Query finalized Solana state
        run: node scripts/verify-token.mjs
      - name: Commit changed report
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- reports/token/latest.md reports/token/latest.json)" ]; then
            echo "No report changes."
            exit 0
          fi
          git config user.name "madger-automation"
          git config user.email "actions@users.noreply.github.com"
          git add reports/token/latest.md reports/token/latest.json
          git commit -m "Refresh on-chain token verification"
          git push
