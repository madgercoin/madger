version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "09:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      official-actions:
        patterns:
          - actions/*
          - github/codeql-action/*
    commit-message:
      prefix: ci
