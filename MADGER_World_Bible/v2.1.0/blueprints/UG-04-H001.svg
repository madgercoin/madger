.0" font-family="DejaVu Sans,monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#426A57">ENTRY</text><text x="774" y="328.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#162D38">(-176, -80.0, -12) m; 1.2 m clear, south side</text><text x="774" y="360.5" font-family="DejaVu Sans,monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#426A57">ROUTE</text><text x="774" y="380.5" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#162D38">South door opens onto the ward&#x27;s existing central</text><text x="774" y="396.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#162D38">street. No private route reaches the surface or</text><text x="774" y="411.5" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#162D38">another level.</text><text x="774" y="444.0" font-family="DejaVu Sans,monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#426A57">ACCESS</text><text x="774" y="464.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#162D38">The doorstep faces a public gallery; the interior</text><text x="774" y="479.5" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#162D38">requires the household&#x27;s permission. Occupants are</text><text x="774" y="495.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#162D38">intentionally not assigned yet.</text><text x="774" y="527.5" font-family="DejaVu Sans,monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#426A57">STORY USE</text><text x="774" y="547.5" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#162D38">A private household moment shows why a shared</text><text x="774" y="563.0" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#162D38">town matters. The heroes are guests, not owners of</text><text x="774" y="578.5" font-family="DejaVu Sans" font-size="11.5" font-weight="normal" text-anchor="start" fill="#162D38">every room.</text></svg>