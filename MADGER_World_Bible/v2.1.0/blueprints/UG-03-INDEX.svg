 / REPAIR &amp; TOOL LOAN</text><text x="774" y="296" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#162D38">Repair tickets, returns, ready shelves and</text><text x="774" y="312" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#162D38">supervised work.</text><text x="774" y="348" font-family="DejaVu Sans,monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#426A57">S03 / PANTRY &amp; PRODUCE</text><text x="774" y="368" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#162D38">Counted stock and specific alternatives when</text><text x="774" y="384" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#162D38">supply changes.</text><text x="774" y="420" font-family="DejaVu Sans,monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#426A57">S04 / MENDING ROOM</text><text x="774" y="440" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#162D38">Consultation, private fitting and visible pickup.</text><text x="774" y="476" font-family="DejaVu Sans,monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#426A57">EXISTING SOUTH BAYS</text><text x="774" y="496" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#162D38">Remain allocated shops. Tenants and detailed</text><text x="774" y="512" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#162D38">plans are still unassigned.</text><text x="774" y="548" font-family="DejaVu Sans,monospace" font-size="10" font-weight="normal" text-anchor="start" fill="#426A57">UNCHANGED CONNECTIONS</text><text x="774" y="568" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#162D38">West to UG-04; east to UG-05; north to UG-08;</text><text x="774" y="584" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#162D38">south through UG-02. Tables and queues stay</text><text x="774" y="600" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="start" fill="#162D38">outside the clear crossing.</text></svg>