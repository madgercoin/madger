A" stroke-width="0.35"/><line x1="40.000" y1="978.000" x2="1560.000" y2="978.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="1018.000" x2="1560.000" y2="1018.000" stroke="#16354A" stroke-width="0.35"/><rect x="38.000" y="138.000" width="1524.000" height="890.000" fill="none" stroke="#648CA0" stroke-width="0.7"/><text x="54.000" y="48.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="23" font-weight="bold" text-anchor="start">MADGER</text><text x="214.000" y="48.000" fill="#82A9BA" font-family="DejaVu Sans Mono" font-size="14" font-weight="normal" text-anchor="start">WORLD DEVELOPMENT  /  INSIDE THE BURROW</text><text x="1546.000" y="48.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="21" font-weight="normal" text-anchor="end">BP-20</text><text x="54.000" y="91.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="32" font-weight="bold" text-anchor="start">How the Madger world grows</text><text x="54.000" y="121.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">Assembly contract / every new area gets a measured plan and a declared connection</text><line x1="38.000" y1="1044.000" x2="1562.000" y2="1044.000" stroke="#648CA0" stroke-width="0.8"/><text x="54.000" y="1071.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="start">BURROW BLUEPRINT ATLAS</text><text x="54.000" y="1095.000" fill="#82A9BA" font-family="DejaVu Sans Mono" font-size="12" font-weight="normal" text-anchor="start">Issue 01  |  20 OCT 2026  |  Base canon v1.0.0</text><text x="635.000" y="1071.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">WORLD: MADGER-BRW-HOME</text><text x="635.000" y="1095.000" fill="#82A9BA" font-family="DejaVu Sans Mono" font-size="12" font-weight="normal" text-anchor="start">Metres  |  +X east  /  +Y north  /  +Z up</text><text x="1546.000" y="1071.000" fill="#E9F7FA" font-family="DejaVu Sans Mono" font-size="16" font-weight="normal" text-anchor="end">21 / 21</text><text x="1546.000" y="1095.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="end">Production design - not construction engineering</text><text x="82.000" y="190.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="18" font-weight="normal" text-anchor="start">01  LOCK THE EXISTING WORLD</text><text x="82.000" y="226.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start">The Burrow is the first district. Keep its 16 anchors, three crossings,</text><text x="82.000" y="252.100" fill="#82A9BA" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start">north direction and elevation datum unchanged. New stories add</text><text x="82.000" y="278.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start">events; new districts attach to documented thresholds.</text><text x="82.000" y="361.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="18" font-weight="normal" text-anchor="start">02  BUILD AN AREA PACKET</text><text x="82.000" y="405.000" fill="#E9F7FA" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">IDENTITY</text><text x="242.000" y="405.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start">Stable ID, name, parent district, first appearance.</text><text x="82.000" y="474.000" fill="#E9F7FA" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">GEOMETRY</text><text x="242.000" y="474.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start">World origin, footprint, rotation, elevation, plan and section.</text><text x="82.000" y="543.000" fill="#E9F7FA" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">CONNECTIONS</text><text x="242.000" y="543.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start">Portal IDs, coordinates, width, level and adjoining portal.</text><text x="82.000" y="612.000" fill="#E9F7FA" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">SYSTEMS</text><text x="242.000" y="612.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start">Walk / cart routes, water, power, data and manual fallbacks.</text><text x="82.000" y="681.000" fill="#E9F7FA" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">CONTINUITY</text><text x="242.000" y="681.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="15" font-weight="normal" text-anchor="start">Materials, sightlines, soil volumes and event-state overlays.</text><text x="82.000" y="798.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="18" font-weight="normal" text-anchor="start">03  CHECK THE JOIN BEFORE USE</text><text x="82.000" y="837.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start">Shared portals must match world position, elevation and orientation.</text><text x="82.000" y="863.100" fill="#82A9BA" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start">Check reachable routes, collision, sightlines and scene transitions.</text><text x="82.000" y="889.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start">Publish the area packet before using it in a story, game or image.</text><line x1="788.000" y1="170.000" x2="788.000" y2="1004.000" stroke="#648CA0" stroke-width="0.8"/><text x="840.000" y="190.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">RESERVED WORLD CONNECTIONS</text><text x="840.000" y="236.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="start">BRW-X01 / West emergency door</text><text x="840.000" y="267.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="16" font-weight="normal" text-anchor="start">(-240, -95, 0) m</text><text x="840.000" y="297.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">Fixed closed threshold; inspected emergency provision. Route beyond it</text><text x="840.000" y="320.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">remains unassigned and offscreen.</text><text x="840.000" y="388.400" fill="#E9F7FA" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="start">BRW-X02 / Southeast treatment/service access</text><text x="840.000" y="419.400" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="16" font-weight="normal" text-anchor="start">(210, -145, -3) m</text><text x="840.000" y="449.400" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">Fixed service threshold; not a free public tunnel or an Episode 1 adventure</text><text x="840.000" y="472.600" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">route.</text><text x="840.000" y="540.800" fill="#E9F7FA" font-family="DejaVu Sans" font-size="18" font-weight="bold" text-anchor="start">BRW-X03 / East exterior threshold</text><text x="840.000" y="571.800" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="16" font-weight="normal" text-anchor="start">(294, 0, 0) m</text><text x="840.000" y="601.800" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">Fixed boundary; exterior roads/lands to be added later without moving the gate.</text><text x="840.000" y="758.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">VERSIONING AND SOURCE OF TRUTH</text><text x="840.000" y="794.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">This atlas is Blueprint Issue 01, an additive production drawing set based on</text><text x="840.000" y="817.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">World Bible v1.0.0. Footprints and anchors are inherited; new partitions, zone</text><text x="840.000" y="840.400" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">layouts and portal widths are authored here.</text><text x="840.000" y="919.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">Exterior lands remain unassigned. Existing Expedition courses keep their layouts</text><text x="840.000" y="942.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">until connection sheets establish where they join this world.</text></svg>