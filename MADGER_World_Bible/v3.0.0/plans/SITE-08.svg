ont-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">path through a hazard is</text><text x="870" y="420" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">conditional, not a promise of</text><text x="870" y="440" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">safe access. The scene state</text><text x="870" y="460" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">must record water, wind, closure</text><text x="870" y="480" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">or occupancy before action.</text><polyline points="73.57,684.00 816.43,684.00" fill="none" stroke="#A66C3A" stroke-width="1" stroke-dasharray=""/><text x="445.0" y="678.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#A66C3A">200 m</text><text x="50" y="797" font-family="DejaVu Sans" font-size="12" fill="#203B3A">Fictional production blueprint • Units: metres unless labelled • JSON controls geometry</text></svg>