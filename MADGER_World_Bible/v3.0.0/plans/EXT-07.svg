ans-serif" font-size="13" fill="#203B3A">Motif: tether collar and</text><text x="875" y="496" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">adjustable deck.</text><polyline points="157.50,675.00 257.50,675.00" fill="none" stroke="#A66C3A" stroke-width="1" stroke-dasharray=""/><text x="207.5" y="669.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#A66C3A">200 m</text><text x="50" y="797" font-family="DejaVu Sans" font-size="12" fill="#203B3A">Fictional production blueprint • Units: metres unless labelled • JSON controls geometry</text></svg>