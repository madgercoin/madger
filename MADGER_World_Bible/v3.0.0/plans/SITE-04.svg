anchor="middle" font-family="DejaVu Sans" font-size="10" fill="#203B3A">REFUGE</text><text x="870" y="190" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Upper landing and two raised</text><text x="870" y="211" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">exits remain above the expected</text><text x="870" y="232" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">low-tide window; boats are</text><text x="870" y="253" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">staged outside.</text><text x="870" y="380" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">Reference path shown in ochre. A</text><text x="870" y="400" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">path through a hazard is</text><text x="870" y="420" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">conditional, not a promise of</text><text x="870" y="440" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">safe access. The scene state</text><text x="870" y="460" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">must record water, wind, closure</text><text x="870" y="480" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">or occupancy before action.</text><polyline points="103.00,723.60 787.00,723.60" fill="none" stroke="#A66C3A" stroke-width="1" stroke-dasharray=""/><text x="445.0" y="717.6" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#A66C3A">120 m</text><text x="50" y="797" font-family="DejaVu Sans" font-size="12" fill="#203B3A">Fictional production blueprint • Units: metres unless labelled • JSON controls geometry</text></svg>