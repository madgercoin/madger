47,244.74" fill="none" stroke="#D9DFD8" stroke-width="0.6" stroke-dasharray=""/><rect x="75.53" y="244.74" width="162.57" height="410.53" fill="#DFE5D7" stroke="#203B3A" stroke-width="1"/><rect x="238.09" y="244.74" width="413.81" height="410.53" fill="#DFE5D7" stroke="#203B3A" stroke-width="1"/><rect x="651.91" y="244.74" width="162.57" height="410.53" fill="#DFE5D7" stroke="#203B3A" stroke-width="1"/><rect x="297.21" y="404.84" width="295.58" height="176.53" fill="#C7DFE6" stroke="#203B3A" stroke-width="1"/><text x="445.00" y="496.96" text-anchor="middle" font-family="DejaVu Sans" font-size="11" fill="#203B3A">CUT COUPLING</text><polyline points="75.53,450.00 238.09,450.00 445.00,552.63 651.91,450.00 814.47,450.00" fill="none" stroke="#A66C3A" stroke-width="3" stroke-dasharray=""/><rect x="403.95" y="285.79" width="82.11" height="65.68" fill="#B8CEBF" stroke="#203B3A" stroke-width="1"/><text x="445.00" y="322.13" text-anchor="middle" font-family="DejaVu Sans" font-size="10" fill="#203B3A">REFUGE</text><text x="870" y="190" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">North and south abutments are</text><text x="870" y="211" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">separate; a safe foot detour</text><text x="870" y="232" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">takes two days and does not</text><text x="870" y="253" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">reconnect the span.</text><text x="870" y="380" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">Reference path shown in ochre. A</text><text x="870" y="400" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">path through a hazard is</text><text x="870" y="420" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">conditional, not a promise of</text><text x="870" y="440" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">safe access. The scene state</text><text x="870" y="460" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">must record water, wind, closure</text><text x="870" y="480" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">or occupancy before action.</text><polyline points="75.53,667.58 814.47,667.58" fill="none" stroke="#A66C3A" stroke-width="1" stroke-dasharray=""/><text x="444.99999999999994" y="661.578947368421" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#A66C3A">180 m</text><text x="50" y="797" font-family="DejaVu Sans" font-size="12" fill="#203B3A">Fictional production blueprint • Units: metres unless labelled • JSON controls geometry</text></svg>