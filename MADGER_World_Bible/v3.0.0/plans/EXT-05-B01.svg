p.</text><text x="720" y="203" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Openings are marked in walls.</text><text x="720" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Open stall bays connect directly to the</text><text x="720" y="275" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">aisle. Storage is within each stall</text><text x="720" y="295" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">allocation. Both ends remain open to public</text><text x="720" y="315" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">exit courts.</text><text x="720" y="355" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Use the room allocations shown; movable</text><text x="720" y="375" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">furnishings may vary without shifting</text><text x="720" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">walls, doors or stairs.</text><rect x="164.34" y="691.62" width="381.32" height="40.67" fill="#D4D6CD" stroke="#203B3A" stroke-width="1"/><polyline points="164.34,691.62 355.00,602.71 545.66,691.62" fill="none" stroke="#203B3A" stroke-width="2" stroke-dasharray=""/><rect x="177.05" y="704.33" width="16.52" height="15.25" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="236.37" y="704.33" width="16.52" height="15.25" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="295.68" y="704.33" width="16.52" height="15.25" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="355.00" y="704.33" width="16.52" height="15.25" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="414.32" y="704.33" width="16.52" height="15.25" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="473.63" y="704.33" width="16.52" height="15.25" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="339.75" y="699.24" width="30.51" height="33.05" fill="#6B7E77" stroke="#203B3A"