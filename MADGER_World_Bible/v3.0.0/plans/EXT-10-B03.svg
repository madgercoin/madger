B3A">PLAN / south entry; north is up.</text><text x="720" y="203" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Openings are marked in walls.</text><text x="720" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">24 temporary refuge places with supplies</text><text x="720" y="275" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">and local guidance. This is a finite</text><text x="720" y="295" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">overnight refuge, not a permanent</text><text x="720" y="315" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">population allocation.</text><text x="720" y="355" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Use the room allocations shown; movable</text><text x="720" y="375" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">furnishings may vary without shifting</text><text x="720" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">walls, doors or stairs.</text><rect x="197.85" y="679.00" width="314.30" height="50.29" fill="#D4D6CD" stroke="#203B3A" stroke-width="1"/><polyline points="197.85,679.00 355.00,605.72 512.15,679.00" fill="none" stroke="#203B3A" stroke-width="2" stroke-dasharray=""/><rect x="213.56" y="694.71" width="20.43" height="18.86" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="284.28" y="694.71" width="20.43" height="18.86" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="355.00" y="694.71" width="20.43" height="18.86" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="425.72" y="694.71" width="20.43" height="18.86" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="336.14" y="688.43" width="37.72" height="40.86" fill="#6B7E77" stroke="#203B3A" stroke-width="1"/><text x="720" y="670" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">FRONT ELEVATION / eaves 3.2 m; ridge 7.9 m.</text><text x="720" y="69