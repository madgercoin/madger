><text x="720" y="182" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">PLAN / south entry; north is up.</text><text x="720" y="203" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Openings are marked in walls.</text><text x="720" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Private care rooms do not become general</text><text x="720" y="275" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">circulation. Four recovery bays and a</text><text x="720" y="295" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">staffed reception; not a full regional</text><text x="720" y="315" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">hospital.</text><text x="720" y="355" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Nominal wall-center dimensions; 0.25 m</text><text x="720" y="375" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">partitions. Upper levels repeat unless the</text><text x="720" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">floor schedule states a variant.</text><rect x="189.94" y="681.98" width="330.13" height="48.02" fill="#D4D6CD" stroke="#203B3A" stroke-width="1"/><polyline points="189.94,681.98 355.00,605.01 520.06,681.98" fill="none" stroke="#203B3A" stroke-width="2" stroke-dasharray=""/><rect x="204.94" y="696.98" width="19.51" height="18.01" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="279.97" y="696.98" width="19.51" height="18.01" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="355.00" y="696.98" width="19.51" height="18.01" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="430.03" y="696.98" width="19.51" height="18.01" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="336.99" y="690.98" width="36.01" height="39.01" fill="#6B7E77" stroke="#203B3A" stroke-width="1"/><text x="720" y="670" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">FRONT ELEVATION / eaves 3.2 m; ridge 8.3 m.</text><text x="720" y="691" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Regional cladding may change; footprint</text><text x="720" y="712" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">does not.</text><text x="50" y="797" font-family="DejaVu Sans" font-size="12" fill="#203B3A">Fictional production blueprint • Units: metres unless labelled • JSON controls geometry</text></svg>