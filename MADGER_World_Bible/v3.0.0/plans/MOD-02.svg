u Sans" font-size="13" fill="#A66C3A">30 m</text><polyline points="123.50,515.00 123.50,215.00" fill="none" stroke="#A66C3A" stroke-width="1" stroke-dasharray=""/><text x="123.5" y="359.0" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#A66C3A">20 m</text><text x="720" y="182" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">PLAN / south entry; north is up.</text><text x="720" y="203" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Openings are marked in walls.</text><text x="720" y="255" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Six 64 m2 flats per floor, three floors,</text><text x="720" y="275" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">four planning residents per flat = 72. Flat</text><text x="720" y="295" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">interiors use MOD-01 principles scaled to</text><text x="720" y="315" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">the explicit 8 x 8 m envelope. Each flat</text><text x="720" y="335" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">has living/kitchen 8 x 3, passage 8 x 1,</text><text x="720" y="355" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">two sleep rooms 3 x 4 and wash/store 2 x 4.</text><text x="720" y="375" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Stair cores have separate exterior</text><text x="720" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">discharge. The central gallery connects</text><text x="720" y="415" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">both cores; entry openings align with the</text><text x="720" y="435" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">stair landing at the east end, not the</text><text x="720" y="455" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">schematic center door used by other</text><text x="720" y="475" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">modules.</text><text x="720" y="515" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Nominal wall-center dimensions; 0.25 m</text><text x="720" y="535" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">partitions. Upper levels repeat unless the</text><text x="720" y="555" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">floor schedule states a variant.</text><rect x="229.96" y="656.64" width="250.07" height="80.02" fill="#D4D6CD" stroke="#203B3A" stroke-width="1"/><polyline points="229.96,656.64 355.00,598.34 480.04,656.64" fill="none" stroke="#203B3A" stroke-width="2" stroke-dasharray=""/><rect x="238.30" y="718.33" width="10.84" height="10.00" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="277.20" y="718.33" width="10.84" height="10.00" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="316.10" y="718.33" width="10.84" height="10.00" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="355.00" y="718.33" width="10.84" height="10.00" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="393.90" y="718.33" width="10.84" height="10.00" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="432.80" y="718.33" width="10.84" height="10.00" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="238.30" y="691.65" width="10.84" height="10.00" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="277.20" y="691.65" width="10.84" height="10.00" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="316.10" y="691.65" width="10.84" height="10.00" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="355.00" y="691.65" width="10.84" height="10.00" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="393.90" y="691.65" width="10.84" height="10.00" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="432.80" y="691.65" width="10.84" height="10.00" fill="