="445.0" y="687.1764705882352" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#A66C3A">160 m</text><text x="50" y="797" font-family="DejaVu Sans" font-size="12" fill="#203B3A">Fictional production blueprint • Units: metres unless labelled • JSON controls geometry</text></svg>