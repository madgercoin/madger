ints="94.23,186.92 795.77,186.92" fill="none" stroke="#D9DFD8" stroke-width="0.6" stroke-dasharray=""/><rect x="94.23" y="186.92" width="154.34" height="526.15" fill="#DFE5D7" stroke="#203B3A" stroke-width="1"/><rect x="248.57" y="186.92" width="392.86" height="526.15" fill="#DFE5D7" stroke="#203B3A" stroke-width="1"/><rect x="641.43" y="186.92" width="154.34" height="526.15" fill="#DFE5D7" stroke="#203B3A" stroke-width="1"/><rect x="304.69" y="392.12" width="280.62" height="226.25" fill="#798E7E" stroke="#203B3A" stroke-width="1"/><text x="445.00" y="509.10" text-anchor="middle" font-family="DejaVu Sans" font-size="11" fill="#203B3A">RAVINE / root spans</text><polyline points="94.23,450.00 248.57,450.00 445.00,581.54 641.43,450.00 795.77,450.00" fill="none" stroke="#A66C3A" stroke-width="3" stroke-dasharray=""/><rect x="401.15" y="246.55" width="87.69" height="70.15" fill="#B8CEBF" stroke="#203B3A" stroke-width="1"/><text x="445.00" y="285.13" text-anchor="middle" font-family="DejaVu Sans" font-size="10" fill="#203B3A">REFUGE</text><text x="870" y="190" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">Ridge west, crown east; two</text><text x="870" y="211" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">fall-arrest anchor stations and</text><text x="870" y="232" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">a lower rescue shelf.</text><text x="870" y="380" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">Reference path shown in ochre. A</text><text x="870" y="400" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">path through a hazard is</text><text x="870" y="420" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">conditional, not a promise of</text><text x="870" y="440" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">safe access. The scene state</text><text x="870" y="460" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">must record water, wind, closure</text><text x="870" y="480" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#203B3A">or occupancy before action.</text><polyline points="94.23,726.23 795.77,726.23" fill="none" stroke="#A66C3A" stroke-width="1" stroke-dasharray=""/><text x="445.0" y="720.2307692307693" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#A66C3A">160 m</text><text x="50" y="797" font-family="DejaVu Sans" font-size="12" fill="#203B3A">Fictional production blueprint • Units: metres unless labelled • JSON controls geometry</text></svg>