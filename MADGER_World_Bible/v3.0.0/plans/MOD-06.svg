 font-size="14" fill="#203B3A">partitions. Upper levels repeat unless the</text><text x="720" y="395" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">floor schedule states a variant.</text><rect x="222.10" y="663.05" width="265.80" height="70.88" fill="#D4D6CD" stroke="#203B3A" stroke-width="1"/><polyline points="222.10,663.05 355.00,601.07 487.90,663.05" fill="none" stroke="#203B3A" stroke-width="2" stroke-dasharray=""/><rect x="233.18" y="709.56" width="14.40" height="13.29" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="294.09" y="709.56" width="14.40" height="13.29" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="355.00" y="709.56" width="14.40" height="13.29" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="415.91" y="709.56" width="14.40" height="13.29" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="233.18" y="674.12" width="14.40" height="13.29" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="294.09" y="674.12" width="14.40" height="13.29" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="355.00" y="674.12" width="14.40" height="13.29" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="415.91" y="674.12" width="14.40" height="13.29" fill="#A6C8D1" stroke="#203B3A" stroke-width="1"/><rect x="341.71" y="705.13" width="26.58" height="28.79" fill="#6B7E77" stroke="#203B3A" stroke-width="1"/><text x="720" y="670" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">FRONT ELEVATION / eaves 6.4 m; ridge 12.0</text><text x="720" y="691" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">m. Regional cladding may change; footprint</text><text x="720" y="712" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#203B3A">does not.</text><text x="50" y="797" font-family="DejaVu Sans" font-size="12" fill="#203B3A">Fictional production blueprint • Units: metres unless labelled • JSON controls geometry</text></svg>