"0.35"/><line x1="40.000" y1="138.000" x2="1560.000" y2="138.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="178.000" x2="1560.000" y2="178.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="218.000" x2="1560.000" y2="218.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="258.000" x2="1560.000" y2="258.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="298.000" x2="1560.000" y2="298.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="338.000" x2="1560.000" y2="338.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="378.000" x2="1560.000" y2="378.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="418.000" x2="1560.000" y2="418.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="458.000" x2="1560.000" y2="458.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="498.000" x2="1560.000" y2="498.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="538.000" x2="1560.000" y2="538.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="578.000" x2="1560.000" y2="578.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="618.000" x2="1560.000" y2="618.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="658.000" x2="1560.000" y2="658.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="698.000" x2="1560.000" y2="698.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="738.000" x2="1560.000" y2="738.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="778.000" x2="1560.000" y2="778.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="818.000" x2="1560.000" y2="818.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="858.000" x2="1560.000" y2="858.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="898.000" x2="1560.000" y2="898.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="938.000" x2="1560.000" y2="938.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="978.000" x2="1560.000" y2="978.000" stroke="#16354A" stroke-width="0.35"/><line x1="40.000" y1="1018.000" x2="1560.000" y2="1018.000" stroke="#16354A" stroke-width="0.35"/><rect x="38.000" y="138.000" width="1524.000" height="890.000" fill="none" stroke="#648CA0" stroke-width="0.7"/><text x="54.000" y="48.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="23" font-weight="bold" text-anchor="start">MADGER</text><text x="214.000" y="48.000" fill="#82A9BA" font-family="DejaVu Sans Mono" font-size="14" font-weight="normal" text-anchor="start">WORLD DEVELOPMENT  /  ABOVE + BELOW</text><text x="1546.000" y="48.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="21" font-weight="normal" text-anchor="end">UG-C0</text><text x="54.000" y="91.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="32" font-weight="bold" text-anchor="start">World canon / a populated Burrow</text><text x="54.000" y="121.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">Current edition v2.0.0 / owner-directed changes, daily life and story continuity</text><line x1="38.000" y1="1044.000" x2="1562.000" y2="1044.000" stroke="#648CA0" stroke-width="0.8"/><text x="54.000" y="1071.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="15" font-weight="bold" text-anchor="start">UNDERGROUND BLUEPRINT ATLAS</text><text x="54.000" y="1095.000" fill="#82A9BA" font-family="DejaVu Sans Mono" font-size="12" font-weight="normal" text-anchor="start">Issue 02  |  20 OCT 2026  |  Canon v2.0.0</text><text x="635.000" y="1071.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">WORLD: MADGER-BRW-HOME</text><text x="635.000" y="1095.000" fill="#82A9BA" font-family="DejaVu Sans Mono" font-size="12" font-weight="normal" text-anchor="start">Metres  |  +X east  /  +Y north  /  +Z up</text><text x="1546.000" y="1071.000" fill="#E9F7FA" font-family="DejaVu Sans Mono" font-size="16" font-weight="normal" text-anchor="end">28 / 28</text><text x="1546.000" y="1095.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="end">Production design - not construction engineering</text><text x="80.000" y="190.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="16" font-weight="normal" text-anchor="start">A FULL NEIGHBORHOOD WORLD</text><text x="80.000" y="224.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Plan for 2,400 residents: 800 in the outdoor district and 1,600 in four</text><text x="80.000" y="248.650" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">underground wards. The numbers are authored planning figures. Residents</text><text x="80.000" y="273.300" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">cross between both parts for work, learning, meals and leisure.</text><text x="80.000" y="332.950" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="16" font-weight="normal" text-anchor="start">LIFE BELOW GROUND</text><text x="80.000" y="366.950" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Show doorsteps, household kitchens, children going to school, deliveries,</text><text x="80.000" y="391.600" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">laundry, quiet hours, workshops and neighbor-run shops. Warm light, varied</text><text x="80.000" y="416.250" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">door colors, planted communal pockets and readable street names</text><text x="80.000" y="440.900" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">distinguish districts.</text><text x="80.000" y="500.550" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="16" font-weight="normal" text-anchor="start">WELCOMING ENTRANCES</text><text x="80.000" y="534.550" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Normal public access replaces the earlier closed-gate default. Visitors can</text><text x="80.000" y="559.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">reach public civic areas. Private homes and working service rooms retain</text><text x="80.000" y="583.850" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">ordinary boundaries; access never depends on a token, wallet or game rank.</text><text x="80.000" y="643.500" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="16" font-weight="normal" text-anchor="start">DEFENSE AS A STATE</text><text x="80.000" y="677.500" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">The underground town has a stronger independent boundary if the outdoor</text><text x="80.000" y="702.150" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">district is overrun. Gates, service thresholds and stair access are handled</text><text x="80.000" y="726.800" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">together. Local physical control, civilian refuge and breathable spaces</text><text x="80.000" y="751.450" fill="#82A9BA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">remain essential.</text><line x1="790.000" y1="166.000" x2="790.000" y2="1005.000" stroke="#648CA0" stroke-width="0.8"/><text x="835.000" y="190.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="15" font-weight="normal" text-anchor="start">EPISODE 1</text><text x="835.000" y="221.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">Begin with ordinary life above and below. The underground is familiar and joyful</text><text x="835.000" y="244.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">before any clue. All four heroes appear through helpful actions. No pilot</text><text x="835.000" y="267.400" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">invasion, named villain or threatening bunker reveal.</text><text x="835.000" y="319.600" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="15" font-weight="normal" text-anchor="start">SUBTLE CLUES</text><text x="835.000" y="350.600" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">Retain the duplicate D17 receipt and Snow&#x27;s unfamiliar physical trace. The final</text><text x="835.000" y="373.800" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">receipt can occur after a clearly established routine evening closing; daytime</text><text x="835.000" y="397.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">public access stays open.</text><text x="835.000" y="449.200" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="15" font-weight="normal" text-anchor="start">WHAT REMAINS FIXED</text><text x="835.000" y="480.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">Keep all 16 surface positions and footprints, three canal crossings, the</text><text x="835.000" y="503.400" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">watercourse, hero designs and approved voices. Snow has canine sounds only.</text><text x="835.000" y="526.600" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">No oversized Madger fang.</text><text x="835.000" y="578.800" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="15" font-weight="normal" text-anchor="start">VERSION PRECEDENCE</text><text x="835.000" y="609.800" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">This is v2.0.0 because the owner changed scope, population assumptions and</text><text x="835.000" y="633.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">access rules. Earlier editions stay archived. Their conflicting closed-gate and</text><text x="835.000" y="656.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">400-resident statements are superseded.</text><text x="835.000" y="708.400" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="15" font-weight="normal" text-anchor="start">REUSABLE FOR ALL CONTENT</text><text x="835.000" y="739.400" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">Every future area receives a measured plan and registered connections. The</text><text x="835.000" y="762.600" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">drawing set guides stories, anime and game environments; it does not claim</text><text x="835.000" y="785.800" fill="#82A9BA" font-family="DejaVu Sans" font-size="16" font-weight="normal" text-anchor="start">those releases are already rebuilt.</text></svg>