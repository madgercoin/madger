font-family="DejaVu Sans Mono" font-size="16" font-weight="normal" text-anchor="end">06 / 28</text><text x="1546.000" y="1095.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="end">Production design - not construction engineering</text><text x="80.000" y="200.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="18" font-weight="normal" text-anchor="start">01 / NORMAL DAY</text><rect x="80.000" y="232.000" width="235.000" height="100.000" fill="#0D293F" stroke="#8DDFBD" stroke-width="1.2"/><text x="98.000" y="267.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Outdoor entrance open</text><line x1="316.000" y1="282.000" x2="343.000" y2="282.000" stroke="#8DDFBD" stroke-width="1.5"/><rect x="345.000" y="232.000" width="235.000" height="100.000" fill="#0D293F" stroke="#8DDFBD" stroke-width="1.2"/><text x="363.000" y="267.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Public welcome hall</text><line x1="581.000" y1="282.000" x2="608.000" y2="282.000" stroke="#8DDFBD" stroke-width="1.5"/><rect x="610.000" y="232.000" width="235.000" height="100.000" fill="#0D293F" stroke="#8DDFBD" stroke-width="1.2"/><text x="628.000" y="267.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Inner gates open</text><line x1="846.000" y1="282.000" x2="873.000" y2="282.000" stroke="#8DDFBD" stroke-width="1.5"/><rect x="875.000" y="232.000" width="235.000" height="100.000" fill="#0D293F" stroke="#8DDFBD" stroke-width="1.2"/><text x="893.000" y="267.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Busy homes + services</text><text x="80.000" y="410.000" fill="#F1C378" font-family="DejaVu Sans Mono" font-size="18" font-weight="normal" text-anchor="start">02 / PROTECTIVE TRANSITION</text><rect x="80.000" y="442.000" width="235.000" height="100.000" fill="#0D293F" stroke="#F1C378" stroke-width="1.2"/><text x="98.000" y="477.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Guide people inward</text><line x1="316.000" y1="492.000" x2="343.000" y2="492.000" stroke="#F1C378" stroke-width="1.5"/><rect x="345.000" y="442.000" width="235.000" height="100.000" fill="#0D293F" stroke="#F1C378" stroke-width="1.2"/><text x="363.000" y="477.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Receive + account</text><line x1="581.000" y1="492.000" x2="608.000" y2="492.000" stroke="#F1C378" stroke-width="1.5"/><rect x="610.000" y="442.000" width="235.000" height="100.000" fill="#0D293F" stroke="#F1C378" stroke-width="1.2"/><text x="628.000" y="477.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Clear closure lines</text><line x1="846.000" y1="492.000" x2="873.000" y2="492.000" stroke="#F1C378" stroke-width="1.5"/><rect x="875.000" y="442.000" width="235.000" height="100.000" fill="#0D293F" stroke="#F1C378" stroke-width="1.2"/><text x="893.000" y="477.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Staff local boundaries</text><text x="80.000" y="620.000" fill="#F1C378" font-family="DejaVu Sans Mono" font-size="18" font-weight="normal" text-anchor="start">03 / SURFACE OVERRUN</text><rect x="80.000" y="652.000" width="235.000" height="100.000" fill="#0D293F" stroke="#F1C378" stroke-width="1.2"/><text x="98.000" y="687.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Surface unsafe</text><line x1="316.000" y1="702.000" x2="343.000" y2="702.000" stroke="#F1C378" stroke-width="1.5"/><rect x="345.000" y="652.000" width="235.000" height="100.000" fill="#0D293F" stroke="#F1C378" stroke-width="1.2"/><text x="363.000" y="687.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Arrival zone isolated</text><line x1="581.000" y1="702.000" x2="608.000" y2="702.000" stroke="#F1C378" stroke-width="1.5"/><rect x="610.000" y="652.000" width="235.000" height="100.000" fill="#0D293F" stroke="#F1C378" stroke-width="1.2"/><text x="628.000" y="687.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">IG-A / IG-B closed</text><line x1="846.000" y1="702.000" x2="873.000" y2="702.000" stroke="#F1C378" stroke-width="1.5"/><rect x="875.000" y="652.000" width="235.000" height="100.000" fill="#0D293F" stroke="#F1C378" stroke-width="1.2"/><text x="893.000" y="687.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="17" font-weight="normal" text-anchor="start">Inner town protected</text><text x="80.000" y="887.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="15" font-weight="normal" text-anchor="start">ALL SURFACE CONNECTIONS COUNT</text><text x="80.000" y="925.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start">The service dock and both stair exits have their own controlled inward thresholds. There is no unrecorded lift,</text><text x="80.000" y="951.100" fill="#82A9BA" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start">hatch or tunnel that bypasses the inner boundary.</text><line x1="1140.000" y1="160.000" x2="1140.000" y2="1010.000" stroke="#648CA0" stroke-width="0.8"/><text x="1180.000" y="184.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">PEOPLE BEFORE CLOSURE</text><text x="1180.000" y="212.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">Stewards keep families together and confirm a</text><text x="1180.000" y="232.300" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">gate line is clear. A busy public hall does not</text><text x="1180.000" y="252.600" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">become an automatic trap.</text><text x="1180.000" y="294.900" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">LOCAL PHYSICAL CONTROL</text><text x="1180.000" y="322.900" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">Records can help staff, but cannot move manual</text><text x="1180.000" y="343.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">bars by themselves. A network fault does not</text><text x="1180.000" y="363.500" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">produce a universal unlock command.</text><text x="1180.000" y="405.800" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">TWO INDEPENDENT STAIRS</text><text x="1180.000" y="433.800" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">The west and east cores are separate from the</text><text x="1180.000" y="454.100" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">central lift court. Occupants do not need network</text><text x="1180.000" y="474.400" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">approval to exit from inside.</text><text x="1180.000" y="516.700" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">LIFE SUPPORT CONTINUES</text><text x="1180.000" y="544.700" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">Air, water, sanitation, communication and</text><text x="1180.000" y="565.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">emergency lighting are zoned and locally</text><text x="1180.000" y="585.300" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">controlled. A sealed refuge still needs working</text><text x="1180.000" y="605.600" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">services.</text><text x="1180.000" y="647.900" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">REFUGE HAS A DAILY LIFE</text><text x="1180.000" y="675.900" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">The assembly hall hosts sport, meetings and</text><text x="1180.000" y="696.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">performances. Its emergency use is an overlay,</text><text x="1180.000" y="716.500" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">not the entire purpose of underground life.</text></svg>