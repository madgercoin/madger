amily="DejaVu Sans Mono" font-size="16" font-weight="normal" text-anchor="end">01 / 28</text><text x="1546.000" y="1095.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="12" font-weight="normal" text-anchor="end">Production design - not construction engineering</text><text x="80.000" y="182.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">SOUTH</text><text x="620.000" y="182.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">NORTH</text><line x1="140.000" y1="178.000" x2="605.000" y2="178.000" stroke="#8DDFBD" stroke-width="0.8"/><rect x="85.000" y="430.000" width="958.000" height="336.000" fill="#122D40" stroke="#648CA0" stroke-width="0.5"/><line x1="85.000" y1="526.000" x2="1043.000" y2="526.000" stroke="#648CA0" stroke-width="0.6" stroke-dasharray="3,5"/><text x="85.000" y="548.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="12" font-weight="normal" text-anchor="start">-12 m</text><line x1="85.000" y1="622.000" x2="1043.000" y2="622.000" stroke="#648CA0" stroke-width="0.6" stroke-dasharray="3,5"/><text x="85.000" y="644.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="12" font-weight="normal" text-anchor="start">-24 m</text><line x1="85.000" y1="718.000" x2="1043.000" y2="718.000" stroke="#648CA0" stroke-width="0.6" stroke-dasharray="3,5"/><text x="85.000" y="740.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="12" font-weight="normal" text-anchor="start">-36 m</text><line x1="85.000" y1="430.000" x2="1043.500" y2="430.000" stroke="#A5D9E8" stroke-width="2"/><rect x="340.600" y="286.000" width="184.600" height="48.000" fill="#0D293F" stroke="#A5D9E8" stroke-width="1.5"/><text x="432.900" y="270.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="13" font-weight="normal" text-anchor="middle">HEARTH HOMES +12 m</text><rect x="358.350" y="311.000" width="18.000" height="23.000" fill="none" stroke="#648C