stroke-width="1.2"/><text x="901.500" y="698.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="11" font-weight="normal" text-anchor="middle">LIFT / STAIR</text><rect x="475.500" y="574.000" width="255.600" height="48.000" fill="#0D293F" stroke="#A5D9E8" stroke-width="1.2"/><text x="603.300" y="602.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="11" font-weight="normal" text-anchor="middle">DEEP COMMONS</text><rect x="234.100" y="574.000" width="127.800" height="48.000" fill="#0D293F" stroke="#A5D9E8" stroke-width="1.2"/><text x="298.000" y="602.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="11" font-weight="normal" text-anchor="middle">BATHS / LAUNDRY</text><rect x="475.500" y="670.000" width="255.600" height="48.000" fill="#0D293F" stroke="#A5D9E8" stroke-width="1.2"/><text x="603.300" y="698.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="11" font-weight="normal" text-anchor="middle">WATER / AIR / PUMPS</text><rect x="283.800" y="430.000" width="28.400" height="96.000" fill="#3A3324" stroke="#F1C378" stroke-width="1.5"/><line x1="390.300" y1="526.000" x2="390.300" y2="478.000" stroke="#F1C378" stroke-width="2"/><line x1="447.100" y1="526.000" x2="447.100" y2="478.000" stroke="#F1C378" stroke-width="2"/><text x="298.000" y="550.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="11" font-weight="normal" text-anchor="middle">WELCOME</text><text x="418.700" y="550.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="11" font-weight="normal" text-anchor="middle">INNER GATES</text><text x="95.000" y="830.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="13" font-weight="normal" text-anchor="start">Section uses vertical exaggeration for clarity. Primary floor levels and Y positions are fixed.</text><text x="95.000" y="864.000" fill="#E9F7FA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">Residential wards flank the commons east and west; they sit outside this section cut.</text><line x1="95.000" y1="902.000" x2="1088.000" y2="902.000" stroke="#648CA0" stroke-width="0.8"/><text x="95.000" y="934.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start">Above: busy markets, gardens and homes. Below: two populated neighborhood levels, then maintainable</text><text x="95.000" y="960.100" fill="#82A9BA" font-family="DejaVu Sans" font-size="18" font-weight="normal" text-anchor="start">services. The refuge is a part of normal civic life, ready to receive surface residents if needed.</text><line x1="1140.000" y1="160.000" x2="1140.000" y2="1010.000" stroke="#648CA0" stroke-width="0.8"/><text x="1180.000" y="184.000" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">ONE SHARED TOWN</text><text x="1180.000" y="212.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">The outdoor Burrow remains important.</text><text x="1180.000" y="232.300" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">Underground streets are also permanent,</text><text x="1180.000" y="252.600" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">crowded neighborhoods with their own daily</text><text x="1180.000" y="272.900" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">rhythms.</text><text x="1180.000" y="315.200" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">POPULATION PLAN</text><text x="1180.000" y="343.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">2,400 residents: 800 above ground and 1,600</text><text x="1180.000" y="363.500" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">below, across four 400-resident wards. These are</text><text x="1180.000" y="383.800" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">new planning figures, not a previously approved</text><text x="1180.000" y="404.100" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">census.</text><text x="1180.000" y="446.400" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">PUBLIC BY DEFAULT</text><text x="1180.000" y="474.400" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">The outdoor entrance and main underground</text><text x="1180.000" y="494.700" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">entry welcome the public during ordinary life.</text><text x="1180.000" y="515.000" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">Shops, school, meals and civic spaces remain</text><text x="1180.000" y="535.300" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">active.</text><text x="1180.000" y="577.600" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">A SECOND DEFENSIVE LINE</text><text x="1180.000" y="605.600" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">The underground Welcome Hall lies before the</text><text x="1180.000" y="625.900" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">Inner Gate Gallery. If the surface is overrun, the</text><text x="1180.000" y="646.200" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">inhabited town can be isolated behind it.</text><text x="1180.000" y="688.500" fill="#8DDFBD" font-family="DejaVu Sans Mono" font-size="13" font-weight="normal" text-anchor="start">CONSISTENT GEOMETRY</text><text x="1180.000" y="716.500" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">The 16 surface footprints stay where they are.</text><text x="1180.000" y="736.800" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">New underground area IDs, vertical connections</text><text x="1180.000" y="757.100" fill="#82A9BA" font-family="DejaVu Sans" font-size="14" font-weight="normal" text-anchor="start">and entrances share the same Sunwell origin.</text></svg>